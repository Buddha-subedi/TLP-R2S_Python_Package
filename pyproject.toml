[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "tlpr2s"
version = "0.1.0"
description = "2D-array SSMIS F16 transfer-learning precipitation retrieval and swath statistics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TLP-R2S research team"}]
keywords = ["precipitation", "SSMIS", "satellite", "XGBoost", "remote sensing"]
dependencies = ["numpy>=1.24", "pandas>=1.5", "scipy>=1.10", "xgboost>=2.0"]
[project.optional-dependencies]
plot = ["matplotlib>=3.7", "cartopy>=0.22"]
io = ["xarray>=2023.1", "netCDF4>=1.6", "h5py>=3.8"]
dev = ["pytest>=7", "build", "twine", "matplotlib>=3.7", "xarray>=2023.1", "netCDF4>=1.6", "h5py>=3.8"]
[project.scripts]
tlpr2s = "tlpr2s.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
tlpr2s = ["model_data/*.json", "model_data/*.npz"]
